# Uses an existing operator-managed MySQL database. No DB initialization or volumes are deleted.
services:
  backend:
    build: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      DB_URL: ${DB_URL:?Set the existing database JDBC URL}
      DB_USERNAME: ${DB_USERNAME:?Set a restricted runtime database user}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set the external HTTPS origin}
      EMS_BUSINESS_TIMEZONE: ${EMS_BUSINESS_TIMEZONE:-Asia/Colombo}
    volumes:
      - ${EMS_SECRET_DIR:?Set an absolute external secrets directory}:/run/secrets:ro
    restart: unless-stopped
  frontend:
    build: ../frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
