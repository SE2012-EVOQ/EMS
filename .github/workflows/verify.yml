name: Verify EMS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare isolated test database and credentials
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mysql-client
          cnf="$RUNNER_TEMP/ems-mysql.cnf"
          printf '[client]\nuser=root\nhost=127.0.0.1\nport=3306\n' > "$cnf"
          chmod 600 "$cnf"
          MYSQL_CNF="$cnf" sh deployment/init-fresh-db.sh
          demo_password="$(openssl rand -hex 24)"
          echo "::add-mask::$demo_password"
          echo "DEV_DEMO_PASSWORD=$demo_password" >> "$GITHUB_ENV"
      - name: Backend test and package
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_URL: jdbc:mysql://127.0.0.1:3306/evoq_ems?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: |
          sh mvnw -q test
          sh mvnw -q -DskipTests package
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          node --test test/api.test.mjs
          npm run build
      - run: git diff --check
