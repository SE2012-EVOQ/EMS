  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            app: {
              bg: '#F4F4F6', card: '#FFFFFF', subtle: '#F7F7F8', border: '#EFEFEF',
              text: '#1A1D1F', muted: '#6F767E', green: '#2A9D68', 'green-bg': '#EAF7EE',
              pink: '#E8636F', 'pink-bg': '#FDF0EE', amber: '#E4A72C', 'amber-bg': '#FFF7DF',
              blue: '#5A7CF7', 'blue-bg': '#EEF2FF'
            }
          },
          boxShadow: {
            card: '0 8px 30px rgba(0,0,0,.04)', 'card-hover': '0 14px 34px rgba(0,0,0,.07)'
          }
        }
      }
    }
  </script>

  <style>
    :root {
      color-scheme: light;
      --ease-fluid: cubic-bezier(.22, 1, .36, 1);
      --ease-soft: cubic-bezier(.4, 0, .2, 1);
    }

    html, body { height: 100%; }
    body { overflow: hidden; }
    body.dark { color-scheme: dark; }

    * { scrollbar-width: thin; scrollbar-color: #d6d8dc transparent; }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: #d6d8dc; border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
    body.dark * { scrollbar-color: #3a414a transparent; }
    body.dark *::-webkit-scrollbar-thumb { background: #3a414a; border: 2px solid transparent; background-clip: padding-box; }

    button, a, input, select, textarea {
      transition-property: background-color, border-color, color, box-shadow, opacity, transform;
      transition-duration: 180ms;
      transition-timing-function: var(--ease-soft);
    }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:not(:disabled):active { transform: scale(.975); }
    button:disabled { cursor: not-allowed; opacity: .55; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(90,124,247,.18), 0 0 0 1px rgba(90,124,247,.55);
    }

    /* Page navigation is intentionally instant. Motion is reserved for local UI
       elements such as modals, popovers, toasts and the mobile drawer. */
    #page { view-transition-name: none; }
    .page-enter { animation: none; transform: none; filter: none; }

    .modal-backdrop {
      background: rgba(15,18,22,.38);
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
    }
    .modal-layer { animation: veilIn .20s ease-out both; }
    .modal-panel { animation: modalIn .30s var(--ease-fluid) both; transform-origin: 50% 45%; }
    .modal-layer.is-closing { animation: veilOut .16s ease-in both; }
    .modal-layer.is-closing .modal-panel { animation: modalOut .16s ease-in both; }
    @keyframes veilIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes veilOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes modalIn { from { opacity: 0; transform: translateY(18px) scale(.975); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes modalOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(9px) scale(.985); } }

    .login-layer { animation: veilIn .24s ease-out both; }
    .login-card { animation: loginIn .42s var(--ease-fluid) both; }
    @keyframes loginIn { from { opacity: 0; transform: translateY(14px) scale(.99); } to { opacity: 1; transform: none; } }

    .floating-panel { transform-origin: top right; }
    .floating-panel:not(.hidden) { animation: popoverIn .20s var(--ease-fluid) both; }
    @keyframes popoverIn { from { opacity: 0; transform: translateY(-6px) scale(.975); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .toast { animation: toastIn .28s var(--ease-fluid); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }

    .surface, .subtle { transition: background-color .32s ease, border-color .32s ease, box-shadow .32s ease, color .32s ease; }
    .surface { box-shadow: 0 8px 30px rgba(0,0,0,.04); }
    button.surface:hover, button.subtle:hover { transform: translateY(-1px); }
    tbody tr { transition: background-color .16s ease; }
    tbody tr:hover { background: rgba(26,29,31,.018); }

    .switch { position: relative; width: 38px; height: 22px; border-radius: 999px; background: #dfe1e5; transition: .24s var(--ease-fluid); }
    .switch:after { content: ''; position: absolute; width: 16px; height: 16px; top: 3px; left: 3px; border-radius: 50%; background: white; box-shadow: 0 1px 3px rgba(0,0,0,.18); transition: .24s var(--ease-fluid); }
    .switch.on { background: #1A1D1F; }
    .switch.on:after { transform: translateX(16px); }

    .theme-switcher { background: #e7e8eb; padding: 3px; border-radius: 999px; gap: 2px !important; }
    .theme-switcher .theme-button { width: 34px; height: 34px; border-radius: 999px; }
    .theme-switcher .theme-selected { background: #fff !important; color: #1A1D1F !important; box-shadow: 0 3px 10px rgba(15,18,22,.10); }

    .clip-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .calendar-grid { display:grid; grid-template-columns: 86px repeat(5,minmax(150px,1fr)); min-width: 830px; }
    .calendar-cell { min-height: 92px; border-right: 1px solid #efefef; border-bottom: 1px solid #efefef; padding: 8px; transition: background-color .25s ease, border-color .25s ease; }
    .no-select { user-select:none; }

    /* Refined graphite dark mode */
    body.dark { background: #0d0f12 !important; color: #f3f5f7; }
    body.dark #app-shell { background: #0f1115 !important; }
    body.dark .bg-app-bg { background: #0f1115 !important; }
    body.dark .bg-white:not(.brandmark):not(.theme-selected) { background: #171a1f !important; }
    body.dark #sidebar {
      background: #101318 !important;
      border-right: 1px solid #1c2128;
      box-shadow: 12px 0 38px rgba(0,0,0,.08);
    }
    body.dark header { background: linear-gradient(180deg, rgba(15,17,21,.98) 0%, rgba(15,17,21,.82) 72%, rgba(15,17,21,0) 100%); }

    body.dark .surface,
    body.dark .bg-white.surface {
      background: #171a1f !important;
      border-color: #252a31 !important;
      box-shadow: 0 10px 34px rgba(0,0,0,.20) !important;
    }
    body.dark .subtle,
    body.dark .bg-app-subtle {
      background: #1d2127 !important;
      border-color: #292f37 !important;
    }
    body.dark .txt, body.dark .text-app-text { color: #f3f5f7 !important; }
    body.dark .muted, body.dark .text-app-muted { color: #9199a4 !important; }
    body.dark .text-gray-400 { color: #737c87 !important; }
    body.dark .text-gray-500 { color: #818a95 !important; }

    body.dark .border-app-border,
    body.dark .border-gray-100,
    body.dark .border-gray-200,
    body.dark .border-gray-300 { border-color: #2a3038 !important; }

    body.dark input, body.dark select, body.dark textarea {
      background: #1c2026 !important;
      border-color: #2b323a !important;
      color: #f3f5f7 !important;
      caret-color: #f3f5f7;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.018);
    }
    body.dark input::placeholder, body.dark textarea::placeholder { color: #68717d !important; }
    body.dark option { background: #171a1f; color: #f3f5f7; }

    body.dark .nav-active {
      position: relative;
      background: #20252c !important;
      color: #ffffff !important;
      box-shadow: inset 0 0 0 1px #2c333c, 0 8px 20px rgba(0,0,0,.16) !important;
    }
    body.dark .nav-active::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 50%;
      width: 3px;
      height: 16px;
      border-radius: 999px;
      background: #dfe6ee;
      transform: translateY(-50%);
    }
    body.dark .hover-surface:hover,
    body.dark button.surface:hover,
    body.dark button.subtle:hover { background: #22272e !important; }

    body.dark .dark-primary {
      background: #eef1f4 !important;
      color: #121519 !important;
      border-color: #eef1f4 !important;
      box-shadow: 0 5px 18px rgba(0,0,0,.22);
    }
    body.dark button.dark-primary:hover { background: #ffffff !important; color: #0d0f12 !important; }
    body.dark .dark-primary.text-white { color: #121519 !important; }

    body.dark .avatar-soft { background: #273142 !important; color: #dce7ff !important; border-color: #343e4d !important; }
    body.dark .brandmark { background: #f4f6f8 !important; border-color: #f4f6f8 !important; }
    body.dark .brandmark > div { border-color: #111318 !important; }

    body.dark .bg-app-green-bg { background: rgba(73,190,127,.13) !important; }
    body.dark .text-app-green { color: #71d7a1 !important; }
    body.dark .bg-app-blue-bg { background: rgba(101,135,255,.14) !important; }
    body.dark .text-app-blue { color: #91a8ff !important; }
    body.dark .bg-app-amber-bg { background: rgba(228,167,44,.13) !important; }
    body.dark .text-app-amber { color: #edbe5d !important; }
    body.dark .bg-app-pink-bg { background: rgba(232,99,111,.13) !important; }
    body.dark .text-app-pink { color: #f08a94 !important; }
    body.dark .bg-gray-100 { background: #232830 !important; }
    body.dark .status-flex { background: rgba(139,111,238,.14) !important; color: #b8a7ff !important; }

    body.dark .theme-switcher { background: #171b20; border: 1px solid #252b33; }
    body.dark .theme-switcher .theme-selected { background: #eef1f4 !important; color: #121519 !important; box-shadow: 0 4px 14px rgba(0,0,0,.28); }

    body.dark .calendar-cell { border-color: #292f37; }
    body.dark tbody tr:hover { background: rgba(255,255,255,.018); }
    body.dark .modal-backdrop { background: rgba(4,6,9,.64); }
    body.dark #mobileBackdrop { background: rgba(2,4,7,.58); }

    body.theme-animating,
    body.theme-animating #app-shell,
    body.theme-animating #sidebar,
    body.theme-animating header,
    body.theme-animating .surface,
    body.theme-animating .subtle,
    body.theme-animating input,
    body.theme-animating select,
    body.theme-animating textarea,
    body.theme-animating button,
    body.theme-animating .calendar-cell {
      transition: background-color .34s ease, color .34s ease, border-color .34s ease, box-shadow .34s ease !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .001ms !important; }
    }
  </style>
</head>

            <input id="globalSearch" oninput="handleGlobalSearch(this.value)" onfocus="handleGlobalSearch(this.value)" type="text" placeholder="Search employees, leave, assets..." class="w-full pl-11 pr-4 py-2.5 bg-white surface border border-transparent rounded-full text-sm font-medium placeholder-gray-400 focus:outline-none focus:border-gray-300 shadow-sm" />

    </main>

          ${card(`<div class="flex items-center justify-between mb-5"><div><h2 class="text-base font-bold txt">Attendance overview</h2><p class="text-xs text-app-muted muted mt-1">Recent attendance through 28 September</p></div><button onclick="navigate('attendance')" class="text-xs font-bold px-3 py-2 border border-gray-200 rounded-full">View records</button></div>${attendanceBars()}`)}
          ${card(`<div class="flex items-center justify-between mb-5"><div><h2 class="text-base font-bold txt">Recent leave requests</h2><p class="text-xs text-app-muted muted mt-1">Latest company requests and statuses</p></div><button onclick="navigate('leave')" class="text-xs font-bold px-3 py-2 border border-gray-200 rounded-full">All leave</button></div>${leaveRows(latestLeaves,false)}`)}
        </div>
        <div class="xl:col-span-4 space-y-6">
          ${card(`<div class="flex items-center justify-between mb-5"><h2 class="text-base font-bold txt">Organization</h2><button onclick="navigate('employees')" class="text-[10px] font-bold text-app-muted muted">Manage</button></div><div class="space-y-4">${['Management','Vision','Platform'].map(team=>{const n=DB.employees.filter(e=>e.team===team&&e.status==='Active').length;return `<div><div class="flex items-center justify-between text-xs font-bold"><span>${team}</span><span>${n}</span></div><div class="h-2 bg-app-subtle subtle rounded-full mt-2 overflow-hidden"><div class="h-full bg-[#1A1D1F] dark-primary rounded-full" style="width:${Math.min(100,n/active*100)}%"></div></div></div>`}).join('')}</div>`)}
          ${card(`<div class="flex items-center justify-between mb-5"><h2 class="text-base font-bold txt">Asset status</h2><button onclick="navigate('assets')" class="text-[10px] font-bold text-app-muted muted">Inventory</button></div>${assetStatusMini()}`)}
        </div>
      </div>`;
  }

  function attendanceBars(){
    return `<div class="h-56 flex items-end gap-3 sm:gap-5 px-1">${dates.map(d=>{const all=DB.attendance.filter(x=>x.date===d); const present=all.filter(x=>x.status!=='Absent').length; const pct=Math.round(present/all.length*100); return `<div class="flex-1 h-full flex flex-col justify-end items-center gap-2"><div class="text-[10px] font-bold text-app-muted muted">${pct}%</div><div class="w-full max-w-12 bg-app-subtle subtle rounded-2xl h-[75%] flex items-end overflow-hidden"><div class="w-full bg-gradient-to-t from-[#58C88E] to-[#8BE0B5] rounded-2xl" style="height:${pct}%"></div></div><span class="text-[10px] font-semibold text-app-muted muted">${new Date(d+'T00:00').toLocaleDateString('en-GB',{weekday:'short'})}</span></div>`}).join('')}</div>`;
  }

  function assetStatusMini(){
    const sts=['Assigned','Available','Maintenance','Damaged'];
    return `<div class="grid grid-cols-2 gap-3">${sts.map(s=>`<button onclick="state.assetFilter='${s}';navigate('assets')" class="subtle bg-app-subtle rounded-2xl p-4 text-left"><div class="text-2xl font-extrabold txt">${DB.assets.filter(a=>a.status===s).length}</div><div class="text-[10px] font-bold text-app-muted muted mt-1">${s}</div></button>`).join('')}</div>`;
  }

  function renderSupervisorDashboard(){
    const ids=DB.employees.filter(e=>e.supervisor===currentEmployee().id).map(e=>e.id);
    const pending=DB.leaveRequests.filter(x=>ids.includes(x.employee)&&x.status==='Pending');
    const team=DB.employees.filter(e=>ids.includes(e.id));
    const todayAttendance=DB.attendance.filter(x=>x.date===DEMO_TODAY&&ids.includes(x.employee));
    return `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-6">${metricCard('Team members',team.length,'users')}${metricCard('Pending approvals',pending.length,'calendar-clock',pending.length?'Action needed':null,false)}${metricCard('Present today',todayAttendance.filter(x=>x.status!=='Absent').length,'badge-check')}${metricCard('Scheduled today',entriesForTeam(teamForSupervisor()).filter(x=>x.date===DEMO_TODAY).length,'calendar-range')}</div>
      <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 items-start"><div class="xl:col-span-7 space-y-6">${card(`<div class="flex items-center justify-between mb-5"><div><h2 class="text-base font-bold txt">Pending leave requests</h2><p class="text-xs text-app-muted muted mt-1">Requests from your team</p></div><button onclick="navigate('leave')" class="text-xs font-bold px-3 py-2 border border-gray-200 rounded-full">Open queue</button></div>${pending.length?leaveRows(pending,true):emptyState('check-circle-2','All caught up','No leave requests are waiting for your decision.')}`)}${card(`<div class="flex items-center justify-between mb-5"><h2 class="text-base font-bold txt">Today’s attendance</h2><button onclick="navigate('attendance')" class="text-xs font-bold text-app-muted muted">View all</button></div>${attendanceRows(todayAttendance.slice(0,6),false)}`)}</div><div class="xl:col-span-5 space-y-6">${card(`<div class="flex items-center justify-between mb-5"><h2 class="text-base font-bold txt">Team</h2><button onclick="navigate('employees')" class="text-xs font-bold text-app-muted muted">Directory</button></div><div class="space-y-3">${team.map(e=>employeeMini(e)).join('')}</div>`)}${card(`<div class="flex items-center justify-between mb-4"><h2 class="text-base font-bold txt">Today’s schedule</h2><button onclick="navigate('schedule')" class="text-xs font-bold text-app-muted muted">Edit schedule</button></div>${scheduleMini(teamForSupervisor(),DEMO_TODAY)}`)}</div></div>`;
  }

  function renderEmployeeDashboard(){
    const me=currentEmployee(), bal=DB.leaveBalances[me.id]||{Annual:0,Medical:0,Casual:0};
    const myLeaves=DB.leaveRequests.filter(x=>x.employee===me.id).slice(0,3);
    const myAssetIds=new Set(assetAssignmentsForEmployee(me.id).map(a=>a.asset)); const myAssets=DB.assets.filter(a=>myAssetIds.has(a.id));
    const today=DB.attendance.find(x=>x.employee===me.id&&x.date===DEMO_TODAY);
    const schedule=getScheduleForEmployee(me,DEMO_TODAY);
    return `<div class="grid grid-cols-2 xl:grid-cols-4 gap-3 sm:gap-4 mb-6">${metricCard('Annual leave',`${bal.Annual} days`,'palmtree')}${metricCard('Medical leave',`${bal.Medical} days`,'heart-pulse')}${metricCard('Casual leave',`${bal.Casual} days`,'coffee')}${metricCard('Assigned assets',myAssets.length,'laptop')}</div>
      <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 items-start"><div class="xl:col-span-8 space-y-6">${card(`<div class="flex items-center justify-between mb-5"><div><h2 class="text-base font-bold txt">Today</h2><p class="text-xs text-app-muted muted mt-1">Monday, 28 September 2026</p></div>${today?statusPill(today.status):''}</div><div class="grid sm:grid-cols-3 gap-3"><div class="subtle bg-app-subtle rounded-2xl p-4"><div class="text-[10px] font-bold text-app-muted muted">SCHEDULE</div><div class="text-lg font-extrabold mt-2 txt">${schedule?`${schedule.start} – ${schedule.end}`:'No schedule'}</div><div class="text-xs text-app-muted muted mt-1">${schedule?.mode||''}</div></div><div class="subtle bg-app-subtle rounded-2xl p-4"><div class="text-[10px] font-bold text-app-muted muted">CHECK IN</div><div class="text-lg font-extrabold mt-2 txt">${today?.checkIn||'—'}</div><div class="text-xs text-app-muted muted mt-1">${today?today.hours+' h recorded':'No record'}</div></div><div class="subtle bg-app-subtle rounded-2xl p-4"><div class="text-[10px] font-bold text-app-muted muted">NOTE</div><div class="text-sm font-extrabold mt-2 txt">${schedule?.note||'Normal working day'}</div></div></div>`)}${card(`<div class="flex items-center justify-between mb-5"><div><h2 class="text-base font-bold txt">Your leave requests</h2><p class="text-xs text-app-muted muted mt-1">Latest request history and status</p></div><button onclick="openLeaveRequestModal()" class="bg-[#1A1D1F] dark-primary text-white rounded-full px-4 py-2 text-xs font-bold">Request leave</button></div>${leaveRows(myLeaves,false)}`)}</div><div class="xl:col-span-4 space-y-6">${card(`<h2 class="text-base font-bold txt mb-5">My profile</h2>${employeeProfileCompact(me)}<button onclick="openEmployeeModal('${me.id}')" class="w-full mt-5 border border-gray-200 rounded-2xl py-3 text-xs font-bold">Edit contact details</button>`)}${card(`<div class="flex items-center justify-between mb-4"><h2 class="text-base font-bold txt">Assigned assets</h2><button onclick="navigate('assets')" class="text-xs font-bold text-app-muted muted">View</button></div>${myAssets.length?myAssets.map(a=>`<div class="flex items-center gap-3 py-2"><div class="w-10 h-10 rounded-xl bg-app-subtle subtle flex items-center justify-center"><i data-lucide="laptop" class="w-4 h-4"></i></div><div class="min-w-0"><div class="text-xs font-bold txt clip-text">${a.name}</div><div class="text-[10px] text-app-muted muted">${a.id} · ${a.status}</div></div></div>`).join(''):emptyState('package-open','No assets','No company assets are assigned to you.')}`)}</div></div>`;
  }

  function renderEmployees(){
    if(state.role==='employee') return renderMyProfile();
    if(state.selectedEmployee){ const e=emp(state.selectedEmployee); if(e&&canSeeEmployee(e)) return renderEmployeeDetail(e); }
    const list=allowedEmployees().filter(e=>state.employeeFilter==='All'||e.team===state.employeeFilter||e.status===state.employeeFilter);
    const actions=state.role==='admin'?`<button onclick="openEmployeeModal()" class="bg-[#1A1D1F] dark-primary text-white rounded-full px-4 py-2.5 text-xs font-bold flex items-center gap-2"><i data-lucide="user-plus" class="w-4 h-4"></i>Add employee</button>`:'';
    return `${pageHeader('Employee directory',state.role==='admin'?'Maintain official employee and organization records.':'Employees under your responsibility.',actions)}
      <div class="flex gap-2 overflow-x-auto pb-3">${['All','Management','Vision','Platform','Inactive'].map(f=>`<button onclick="state.employeeFilter='${f}';render()" class="px-3 py-2 rounded-full text-xs font-bold shrink-0 ${state.employeeFilter===f?'bg-[#1A1D1F] dark-primary text-white':'surface bg-white border border-gray-200'}">${f}</button>`).join('')}</div>
      ${card(`<div class="overflow-x-auto"><table class="w-full min-w-[780px]"><thead><tr class="text-left text-[10px] uppercase tracking-wider text-app-muted muted"><th class="pb-3 font-extrabold">Employee</th><th class="pb-3 font-extrabold">Job title</th><th class="pb-3 font-extrabold">Team / Project</th><th class="pb-3 font-extrabold">Supervisor</th><th class="pb-3 font-extrabold">Status</th><th class="pb-3"></th></tr></thead><tbody>${list.map(e=>`<tr class="border-t border-app-border hover:bg-app-subtle/60 hover-surface cursor-pointer" onclick="openEmployeeDetail('${e.id}')"><td class="py-4"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-[#DEE8FF] avatar-soft flex items-center justify-center text-[10px] font-extrabold">${e.avatar}</div><div><div class="text-xs font-bold txt">${e.name}</div><div class="text-[10px] text-app-muted muted">${e.id} · ${e.email}</div></div></div></td><td class="py-4 text-xs font-semibold txt">${e.title}</td><td class="py-4"><div class="text-xs font-bold txt">${e.team} · ${e.project}</div><div class="text-[10px] text-app-muted muted">${e.department}</div></td><td class="py-4 text-xs text-app-muted muted">${e.supervisor?emp(e.supervisor)?.name:'—'}</td><td class="py-4">${statusPill(e.status)}</td><td class="py-4 text-right"><button class="w-8 h-8 rounded-full hover:bg-white"><i data-lucide="chevron-right" class="w-4 h-4 mx-auto"></i></button></td></tr>`).join('')}</tbody></table></div>`)} `;
  }

  function renderMyProfile(){
    const e=currentEmployee();
    return `${pageHeader('My profile','View official information and update permitted personal contact details.',`<button onclick="openEmployeeModal('${e.id}')" class="bg-[#1A1D1F] dark-primary text-white rounded-full px-4 py-2.5 text-xs font-bold">Edit contact details</button>`)}<div class="grid grid-cols-1 xl:grid-cols-12 gap-6"><div class="xl:col-span-4">${card(employeeProfileCompact(e))}</div><div class="xl:col-span-8">${card(`<h3 class="text-base font-bold txt mb-5">Employment information</h3>${employeeInfoGrid(e)}`)}</div></div>`;
  }

  function employeeProfileCompact(e){return `<div class="flex flex-col items-center text-center"><div class="w-20 h-20 rounded-full bg-[#DEE8FF] avatar-soft flex items-center justify-center text-xl font-extrabold">${e.avatar}</div><div class="text-xl font-extrabold mt-4 txt">${e.name}</div><div class="text-xs text-app-muted muted font-semibold mt-1">${e.title}</div><div class="flex gap-2 mt-3">${statusPill(e.status)}<span class="px-2.5 py-1 rounded-full bg-app-subtle subtle text-[10px] font-bold">${e.id}</span></div><div class="w-full border-t border-app-border mt-5 pt-4 space-y-3 text-left"><div class="flex gap-3"><i data-lucide="mail" class="w-4 h-4 text-app-muted muted"></i><span class="text-xs font-semibold txt">${e.email}</span></div><div class="flex gap-3"><i data-lucide="phone" class="w-4 h-4 text-app-muted muted"></i><span class="text-xs font-semibold txt">${e.phone}</span></div><div class="flex gap-3"><i data-lucide="map-pin" class="w-4 h-4 text-app-muted muted"></i><span class="text-xs font-semibold txt">${e.address}</span></div></div></div>`;}
  function employeeInfoGrid(e){return `<div class="grid sm:grid-cols-2 gap-3">${[['Employee ID',e.id],['Joined',fmtDate(e.joined)],['Job title',e.title],['Team',e.team],['Department',e.department],['Current project',e.project],['Reporting supervisor',e.supervisor?emp(e.supervisor)?.name:'—']].map(([a,b])=>`<div class="subtle bg-app-subtle rounded-2xl p-4"><div class="text-[10px] uppercase font-extrabold tracking-wider text-app-muted muted">${a}</div><div class="text-sm font-bold mt-2 txt">${b}</div></div>`).join('')}</div>`;}
  function openEmployeeDetail(id){state.selectedEmployee=id;render();}

  function renderEmployeeDetail(e){
    const assetIds=new Set(assetAssignmentsForEmployee(e.id).map(a=>a.asset)); const assets=DB.assets.filter(a=>assetIds.has(a.id)); const leaves=DB.leaveRequests.filter(x=>x.employee===e.id).slice(0,4);
    const canViewEmployeeAssets=state.role==='admin'||e.id===currentEmployee().id;
    return `<button onclick="state.selectedEmployee=null;render()" class="mb-4 text-xs font-bold flex items-center gap-2 text-app-muted muted"><i data-lucide="arrow-left" class="w-4 h-4"></i>Back to employees</button>${pageHeader(e.name,`${e.id} · ${e.title}`,state.role==='admin'?`<button onclick="openEmployeeModal('${e.id}')" class="surface bg-white border border-gray-200 rounded-full px-4 py-2.5 text-xs font-bold">Edit record</button><button onclick="deactivateEmployee('${e.id}')" class="rounded-full px-4 py-2.5 text-xs font-bold ${e.status==='Inactive'?'bg-gray-100 text-gray-400':'bg-app-pink-bg text-app-pink'}">${e.status==='Inactive'?'Deactivated':'Deactivate'}</button>`:e.id===currentEmployee().id?`<button onclick="openEmployeeModal('${e.id}')" class="surface bg-white border border-gray-200 rounded-full px-4 py-2.5 text-xs font-bold">Edit contact details</button>`:'')}
      <div class="grid grid-cols-1 xl:grid-cols-12 gap-6"><div class="xl:col-span-4 space-y-6">${card(employeeProfileCompact(e))}${canViewEmployeeAssets?card(`<h3 class="text-sm font-bold txt mb-4">Assigned assets</h3>${assets.length?assets.map(a=>`<div class="flex items-center gap-3 py-2"><div class="w-9 h-9 rounded-xl bg-app-subtle subtle flex items-center justify-center"><i data-lucide="laptop" class="w-4 h-4"></i></div><div><div class="text-xs font-bold txt">${a.name}</div><div class="text-[10px] text-app-muted muted">${a.id} · ${a.status}</div></div></div>`).join(''):`<p class="text-xs text-app-muted muted">No assigned assets.</p>`}`):''}</div><div class="xl:col-span-8 space-y-6">${card(`<h3 class="text-base font-bold txt mb-5">Employment information</h3>${employeeInfoGrid(e)}`)}${card(`<div class="flex justify-between items-center mb-4"><h3 class="text-base font-bold txt">Leave history</h3><button onclick="state.currentPage='leave';render()" class="text-xs font-bold text-app-muted muted">View leave module</button></div>${leaves.length?leaveRows(leaves,false):emptyState('calendar-x','No leave history','No leave requests have been recorded for this employee.')}`)}</div></div>`;
  }

  function employeeMini(e){return `<button onclick="state.currentPage='employees';state.selectedEmployee='${e.id}';render()" class="w-full flex items-center gap-3 p-2 rounded-2xl hover:bg-app-subtle hover-surface text-left"><div class="w-10 h-10 rounded-full bg-[#DEE8FF] avatar-soft flex items-center justify-center text-[10px] font-extrabold">${e.avatar}</div><div class="flex-1 min-w-0"><div class="text-xs font-bold txt clip-text">${e.name}</div><div class="text-[10px] text-app-muted muted clip-text">${e.title}</div></div>${statusPill(e.status)}</button>`;}

  function renderLeave(){
    const leaves=allowedLeave().filter(x=>state.leaveFilter==='All'||x.status===state.leaveFilter);
    const actions=currentEmployee().supervisor?`<button onclick="openLeaveRequestModal()" class="bg-[#1A1D1F] dark-primary text-white rounded-full px-4 py-2.5 text-xs font-bold flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i>Request my leave</button>`:'';
    const balance = DB.leaveBalances[currentEmployee().id]||{};
    const balanceCards=`<div class="mb-2 text-[10px] uppercase tracking-wider font-extrabold text-app-muted muted">My leave balance</div><div class="grid grid-cols-3 gap-3 mb-6">${Object.entries(balance).map(([k,v])=>`<div class="surface bg-white rounded-[24px] p-4 sm:p-5 border border-app-border shadow-card"><div class="text-[10px] font-bold text-app-muted muted">${k.toUpperCase()}</div><div class="text-2xl font-extrabold mt-2 txt">${v}</div><div class="text-[10px] text-app-muted muted">days available</div></div>`).join('')}</div>`;
    return `${pageHeader(state.role==='supervisor'?'Leave & approvals':'Leave management',state.role==='supervisor'?'Approve or reject requests from employees under your responsibility.':state.role==='admin'?'Company-wide leave records and setup.':'Submit requests and view balance, history and status.',actions)}${balanceCards}<div class="flex gap-2 mb-4 overflow-x-auto">${['All','Pending','Approved','Rejected'].map(f=>`<button onclick="state.leaveFilter='${f}';render()" class="px-3 py-2 rounded-full text-xs font-bold shrink-0 ${state.leaveFilter===f?'bg-[#1A1D1F] dark-primary text-white':'surface bg-white border border-gray-200'}">${f}</button>`).join('')}</div>${card(leaves.length?leaveRows(leaves,state.role==='supervisor'):emptyState('calendar-x','No requests','Nothing matches the selected filter.'))}`;
  }

  function leaveRows(items,withActions){
    return `<div class="space-y-1">${items.map(x=>{const e=emp(x.employee);const canDecide=withActions&&state.role==='supervisor'&&e.supervisor===currentEmployee().id&&x.status==='Pending';return `<div class="flex flex-col sm:flex-row sm:items-center gap-3 p-3 rounded-2xl hover:bg-app-subtle hover-surface"><div class="flex items-center gap-3 flex-1 min-w-0"><div class="w-10 h-10 rounded-full bg-[#DEE8FF] avatar-soft flex items-center justify-center text-[10px] font-extrabold shrink-0">${e.avatar}</div><div class="min-w-0"><div class="text-xs font-bold txt clip-text">${e.name} <span class="text-app-muted muted font-medium">· ${x.type}</span></div><div class="text-[10px] text-app-muted muted mt-1">${fmtShort(x.from)} → ${fmtShort(x.to)} · ${x.days} day${x.days>1?'s':''} · ${esc(x.reason)}</div></div></div><div class="flex items-center gap-2 sm:justify-end">${statusPill(x.status)}${canDecide?`<button onclick="event.stopPropagation();decideLeave('${x.id}','Approved')" class="w-8 h-8 rounded-full bg-app-green-bg text-app-green flex items-center justify-center"><i data-lucide="check" class="w-4 h-4"></i></button><button onclick="event.stopPropagation();decideLeave('${x.id}','Rejected')" class="w-8 h-8 rounded-full bg-app-pink-bg text-app-pink flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button>`:''}</div></div>`}).join('')}</div>`;
  }

  function renderAttendance(){
    const rows=allowedAttendance().filter(x=>state.attendanceFilter==='All'||x.status===state.attendanceFilter).sort((a,b)=>b.date.localeCompare(a.date));
    const avg=rows.length?(rows.reduce((s,x)=>s+x.hours,0)/rows.length).toFixed(1):0;
    const actions=state.role==='admin'?`<button onclick="openAttendanceModal()" class="bg-[#1A1D1F] dark-primary text-white rounded-full px-4 py-2.5 text-xs font-bold flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i>Add / correct record</button>`:'';
    return `${pageHeader('Attendance records',state.role==='admin'?'Manage attendance notes and corrections.':state.role==='supervisor'?'Attendance information for your team.':'Your recorded attendance history.',actions)}<div class="grid grid-cols-3 gap-3 mb-6">${metricCard('Records',rows.length,'clipboard-list')}${metricCard('Avg. hours',avg,'clock-3')}${metricCard('Late / absent',rows.filter(x=>['Late','Absent'].includes(x.status)).length,'alert-circle')}</div><div class="flex gap-2 mb-4 overflow-x-auto">${['All','Present','Late','Absent','Leave'].map(f=>`<button onclick="state.attendanceFilter='${f}';render()" class="px-3 py-2 rounded-full text-xs font-bold shrink-0 ${state.attendanceFilter===f?'bg-[#1A1D1F] dark-primary text-white':'surface bg-white border border-gray-200'}">${f}</button>`).join('')}</div>${card(attendanceRows(rows,true))}`;
  }

  function attendanceRows(rows,full=true){
    return `<div class="overflow-x-auto"><table class="w-full min-w-[720px]"><thead><tr class="text-left text-[10px] uppercase tracking-wider text-app-muted muted"><th class="pb-3">Employee</th><th class="pb-3">Date</th><th class="pb-3">Status</th><th class="pb-3">In</th><th class="pb-3">Out</th><th class="pb-3">Hours</th><th class="pb-3">Note</th>${state.role==='admin'&&full?'<th></th>':''}</tr></thead><tbody>${rows.map(x=>`<tr class="border-t border-app-border"><td class="py-3 text-xs font-bold txt">${emp(x.employee)?.name}</td><td class="py-3 text-xs text-app-muted muted">${fmtDate(x.date)}</td><td class="py-3">${statusPill(x.status)}</td><td class="py-3 text-xs font-semibold txt">${x.checkIn}</td><td class="py-3 text-xs font-semibold txt">${x.checkOut}</td><td class="py-3 text-xs font-semibold txt">${x.hours}</td><td class="py-3 text-[10px] text-app-muted muted">${x.note||'—'}</td>${state.role==='admin'&&full?`<td class="py-3 text-right"><button onclick="openAttendanceModal('${x.id}')" class="w-8 h-8 rounded-full hover:bg-app-subtle hover-surface"><i data-lucide="pencil" class="w-3.5 h-3.5 mx-auto"></i></button></td>`:''}</tr>`).join('')}</tbody></table></div>`;
  }

  function renderSchedule(){
    const teams=state.role==='admin'?['Platform','Vision','Management']:[state.role==='supervisor'?teamForSupervisor():currentEmployee().team];
    if(!teams.includes(state.scheduleTeam)) state.scheduleTeam=teams[0];
    const canEdit=state.role==='supervisor';
    const actions=canEdit?`<button onclick="openScheduleModal()" class="bg-[#1A1D1F] dark-primary text-white rounded-full px-4 py-2.5 text-xs font-bold flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i>Add schedule entries</button>`:'';
    const entries = state.role==='employee'

      ${card(`<div class="flex items-center justify-between mb-4"><div><h3 class="text-sm font-extrabold txt">Schedule entries</h3><p class="text-[10px] text-app-muted muted mt-1">Each row represents one employee assignment in the schedule.</p></div></div><div class="overflow-x-auto"><table class="w-full min-w-[760px]"><thead><tr class="text-left text-[10px] uppercase tracking-wider text-app-muted muted"><th class="pb-3">Employee</th><th class="pb-3">Date</th><th class="pb-3">Time</th><th class="pb-3">Mode</th><th class="pb-3">Note</th>${canEdit?'<th></th>':''}</tr></thead><tbody>${entries.sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start)||emp(a.employee).name.localeCompare(emp(b.employee).name)).map(x=>`<tr class="border-t border-app-border"><td class="py-3 text-xs font-bold txt">${emp(x.employee)?.name}</td><td class="py-3 text-xs text-app-muted muted">${fmtDate(x.date)}</td><td class="py-3 text-xs font-semibold txt">${x.start} – ${x.end}</td><td class="py-3">${statusPill(x.mode)}</td><td class="py-3 text-[10px] text-app-muted muted">${esc(x.note||'—')}</td>${canEdit?`<td class="py-3 text-right"><button onclick="openScheduleModal('${x.id}')" class="w-8 h-8 rounded-full hover:bg-app-subtle hover-surface"><i data-lucide="pencil" class="w-3.5 h-3.5 mx-auto"></i></button></td>`:''}</tr>`).join('')}</tbody></table></div>`)} `;

  function modal(title,subtitle,body,footer='',size='max-w-xl'){
    document.getElementById('modalRoot').innerHTML=`<div class="modal-layer fixed inset-0 z-[80] modal-backdrop p-4 flex items-center justify-center" onclick="if(event.target===this)closeModal()"><div class="modal-panel surface bg-white w-full ${size} max-h-[90vh] overflow-hidden rounded-[30px] shadow-2xl border border-white/30"><div class="p-5 sm:p-6 flex items-start justify-between gap-3 border-b border-app-border"><div><div class="text-lg font-extrabold tracking-tight txt">${title}</div><div class="text-xs text-app-muted muted mt-1">${subtitle}</div></div><button onclick="closeModal()" class="w-9 h-9 rounded-full bg-app-subtle subtle flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="p-5 sm:p-6 overflow-y-auto max-h-[68vh]">${body}</div>${footer?`<div class="p-5 sm:p-6 border-t border-app-border flex justify-end gap-2">${footer}</div>`:''}</div></div>`; lucide.createIcons();
    requestAnimationFrame(()=>document.querySelector('#modalRoot input:not([disabled]), #modalRoot select:not([disabled]), #modalRoot textarea:not([disabled])')?.focus({preventScroll:true}));
  }
  function closeModal(){
    const root=document.getElementById('modalRoot'), layer=root.firstElementChild;
    if(!layer){return;}
    if(layer.classList.contains('is-closing'))return;

    setTimeout(()=>{ if(root.firstElementChild===layer) root.innerHTML=''; },170);
  }
  const field=(label,id,value='',type='text',extra='')=>`<label class="block"><span class="text-[10px] uppercase tracking-wider font-extrabold text-app-muted muted">${label}</span><input id="${id}" type="${type}" value="${esc(value)}" ${extra} class="w-full mt-2 px-4 py-3 rounded-2xl bg-app-subtle subtle border border-transparent focus:border-gray-300 outline-none text-xs font-semibold" /></label>`;

  }

  function openEmployeeModal(id){
    const e=id?emp(id):null; const employeeEditingOwn=state.role!=='admin'&&e?.id===currentEmployee().id;
    if(state.role!=='admin'&&!employeeEditingOwn){toast('This role cannot modify official employee records.','warn');return;}
    const body=`<div class="grid sm:grid-cols-2 gap-4">${field('Full name','fName',e?.name||'', 'text',employeeEditingOwn?'disabled':'')}${field('Email','fEmail',e?.email||'','email',employeeEditingOwn?'disabled':'')}${field('Phone','fPhone',e?.phone||'')}${field('Address','fAddress',e?.address||'')}${employeeEditingOwn?'':`${field('Job title','fTitle',e?.title||'')}${field('Joined date','fJoined',e?.joined||DEMO_TODAY,'date')}${selectField('Department','fDepartment',['Management','Engineering'],e?.department||'Engineering')}${selectField('Team','fTeam',['Management','Vision','Platform'],e?.team||'Platform')}${field('Current project','fProject',e?.project||'')}${selectField('Supervisor','fSupervisor',['—'].concat(DB.employees.filter(x=>x.status==='Active'&&x.id!==e?.id).map(x=>`${x.id} · ${x.name}`)),e?.supervisor?`${e.supervisor} · ${emp(e.supervisor)?.name}`:'—')}`}</div>`;
    modal(e?'Edit employee':'Add employee',employeeEditingOwn?'Only permitted contact information is editable.':'Official employee and organization information.',body,`<button onclick="closeModal()" class="px-4 py-2.5 rounded-full border border-gray-200 text-xs font-bold">Cancel</button><button onclick="saveEmployee('${id||''}')" class="px-5 py-2.5 rounded-full bg-[#1A1D1F] dark-primary text-white text-xs font-bold">Save</button>`,'max-w-2xl');

  function saveEmployee(id){
    const existing=id?emp(id):null;
    if(existing && state.role==='employee'){
      existing.phone=document.getElementById('fPhone').value.trim(); existing.address=document.getElementById('fAddress').value.trim();
      closeModal(); render(); toast('Contact details updated.'); return;
    }
    const name=document.getElementById('fName').value.trim(); if(!name){toast('Name is required.','warn');return;}
    const values={name,email:document.getElementById('fEmail').value.trim(),phone:document.getElementById('fPhone').value.trim(),address:document.getElementById('fAddress').value.trim(),title:document.getElementById('fTitle').value.trim(),joined:document.getElementById('fJoined').value,department:document.getElementById('fDepartment').value,team:document.getElementById('fTeam').value,project:document.getElementById('fProject').value.trim(),supervisor:(document.getElementById('fSupervisor').value.split(' · ')[0]||null)};
    if(values.supervisor==='—')values.supervisor=null;
    if(existing) Object.assign(existing,values); else {const next='E'+String(Math.max(...DB.employees.map(x=>+x.id.slice(1)))+1).padStart(3,'0');DB.employees.push({id:next,...values,status:'Active',avatar:initials(name)});DB.leaveBalances[next]={Annual:12,Medical:7,Casual:4};DB.userAccounts.push({id:'U'+next.slice(1),employee:next,username:(values.email.split('@')[0]||next.toLowerCase()),role:'EMPLOYEE',active:true});}

    modal('Deactivate employee','Historical records will be retained.',`<p class="text-sm font-semibold txt">Deactivate <strong>${e.name}</strong>? The record will remain available for historical reference.</p>`,`<button onclick="closeModal()" class="px-4 py-2.5 rounded-full border border-gray-200 text-xs font-bold">Cancel</button><button onclick="confirmDeactivate('${id}')" class="px-5 py-2.5 rounded-full bg-app-pink text-white text-xs font-bold">Deactivate</button>`);

  function openLeaveRequestModal(){

    modal('Request leave','Submit a new leave request to your supervisor.',`<div class="grid sm:grid-cols-2 gap-4">${selectField('Leave type','lvType',['Annual','Medical','Casual'],'Annual')}${field('Available','lvAvailable',`${bal.Annual||0} days`,'text','disabled')}${field('From','lvFrom',DEMO_TODAY,'date')}${field('To','lvTo',DEMO_TODAY,'date')}</div><label class="block mt-4"><span class="text-[10px] uppercase tracking-wider font-extrabold text-app-muted muted">Reason</span><textarea id="lvReason" rows="3" class="w-full mt-2 px-4 py-3 rounded-2xl bg-app-subtle subtle border border-transparent outline-none text-xs font-semibold" placeholder="Brief reason"></textarea></label>`,`<button onclick="closeModal()" class="px-4 py-2.5 rounded-full border border-gray-200 text-xs font-bold">Cancel</button><button onclick="submitLeave()" class="px-5 py-2.5 rounded-full bg-[#1A1D1F] dark-primary text-white text-xs font-bold">Submit request</button>`);
    document.getElementById('lvType').onchange=()=>document.getElementById('lvAvailable').value=`${bal[document.getElementById('lvType').value]||0} days`;

  function submitLeave(){
    const type=document.getElementById('lvType').value, from=document.getElementById('lvFrom').value,to=document.getElementById('lvTo').value,reason=document.getElementById('lvReason').value.trim(); if(!currentEmployee().supervisor){toast('No reporting supervisor is configured for this employee, so an approval route cannot be created.','warn');return;}

    const days=Math.round((new Date(to)-new Date(from))/86400000)+1; const balance=DB.leaveBalances[currentEmployee().id]?.[type]||0;
    if(days>balance){toast(`Only ${balance} ${type.toLowerCase()} leave day(s) are available.`,'warn');return;}
    const next='LV-'+(Math.max(...DB.leaveRequests.map(x=>+x.id.split('-')[1]))+1); DB.leaveRequests.unshift({id:next,employee:currentEmployee().id,type,from,to,days,reason:reason||'—',status:'Pending',submitted:DEMO_TODAY,decidedBy:null,decidedAt:null}); closeModal();state.currentPage='leave';render();toast('Leave request submitted.');
  }
  function decideLeave(id,status){

  function saveAttendance(id){

    if(state.role!=='supervisor'){toast('Only supervisors/team leads can create or update team schedules.','warn');return;}
    const entry=id?DB.scheduleEntries.find(x=>x.id===id):null;
    const teamMembers=[currentEmployee(),...directReports()].filter((e,i,a)=>e.team===teamForSupervisor()&&a.findIndex(x=>x.id===e.id)===i);
    if(!teamMembers.length){toast('No active employees are assigned to your team.','warn');return;}
    const employeeControl=entry
      ? selectField('Employee','scEmployee',teamMembers.map(e=>`${e.id} · ${e.name}`),`${entry.employee} · ${emp(entry.employee)?.name}`)
      : `<label class="block sm:col-span-2"><span class="text-[10px] uppercase tracking-wider font-extrabold text-app-muted muted">Employees</span><select id="scEmployees" multiple size="${Math.min(5,teamMembers.length)}" class="w-full mt-2 px-4 py-3 rounded-2xl bg-app-subtle subtle border border-transparent focus:border-gray-300 outline-none text-xs font-semibold">${teamMembers.map(e=>`<option value="${e.id}" selected>${e.id} · ${e.name}</option>`).join('')}</select><span class="block text-[10px] text-app-muted muted mt-1">Ctrl/Cmd-click to choose specific employees.</span></label>`;
    modal(entry?'Update schedule entry':'Add schedule entries',`Schedule entries for the ${teamForSupervisor()} team.`,`<div class="grid sm:grid-cols-2 gap-4">${employeeControl}${field('Date','scDate',entry?.date||DEMO_TODAY,'date')}${selectField('Mode','scMode',['Office','Remote','Flexible','Lab','Field'],entry?.mode||'Office')}${field('Start','scStart',entry?.start||'09:00','time')}${field('End','scEnd',entry?.end||'17:30','time')}</div><label class="block mt-4"><span class="text-[10px] uppercase tracking-wider font-extrabold text-app-muted muted">Schedule note</span><textarea id="scNote" rows="3" class="w-full mt-2 px-4 py-3 rounded-2xl bg-app-subtle subtle text-xs font-semibold">${esc(entry?.note||'')}</textarea></label>`,`<button onclick="closeModal()" class="px-4 py-2.5 rounded-full border border-gray-200 text-xs font-bold">Cancel</button><button onclick="saveSchedule('${id||''}')" class="px-5 py-2.5 rounded-full bg-[#1A1D1F] dark-primary text-white text-xs font-bold">Save schedule</button>`,'max-w-2xl');
  }
  function saveSchedule(id){
    const date=document.getElementById('scDate').value, mode=document.getElementById('scMode').value, start=document.getElementById('scStart').value, end=document.getElementById('scEnd').value, note=document.getElementById('scNote').value.trim()||'Normal working period';
    if(!date||!start||!end||start>=end){toast('Enter a valid date and working period.','warn');return;}
    const employeeIds=id?[document.getElementById('scEmployee').value.split(' · ')[0]]:[...document.getElementById('scEmployees').selectedOptions].map(o=>o.value);
    if(!employeeIds.length){toast('Select at least one employee.','warn');return;}
    for(const employeeId of employeeIds){
      const leave=approvedLeaveOn(employeeId,date);
      if(leave){toast(`${emp(employeeId).name} has approved ${leave.type.toLowerCase()} leave on ${fmtDate(date)}.`,'warn');return;}
      const overlap=DB.scheduleEntries.find(x=>x.employee===employeeId&&x.date===date&&x.id!==id&&timesOverlap(start,end,x.start,x.end));
      if(overlap){toast(`${emp(employeeId).name} already has an overlapping schedule entry (${overlap.start}–${overlap.end}).`,'warn');return;}
    }
    let parent=scheduleForTeam(teamForSupervisor());
    if(!parent){parent={id:`SCH-${String(DB.schedules.length+1).padStart(3,'0')}`,team:teamForSupervisor(),periodStart:DEMO_WEEK[0],periodEnd:DEMO_WEEK.at(-1),status:'Published',createdBy:currentEmployee().id,createdAt:DEMO_TODAY,updatedAt:DEMO_TODAY};DB.schedules.push(parent);}
    if(id){const existing=DB.scheduleEntries.find(x=>x.id===id);Object.assign(existing,{employee:employeeIds[0],date,start,end,mode,note});}
    else employeeIds.forEach(employeeId=>DB.scheduleEntries.push({id:`SE-${String(scheduleEntryCounter++).padStart(3,'0')}`,scheduleId:parent.id,employee:employeeId,date,start,end,mode,note}));
    parent.updatedAt=DEMO_TODAY; closeModal();state.scheduleTeam=teamForSupervisor();render();toast(id?'Schedule entry updated.':'Schedule entries created.');
  }

  function openAssetModal(){
    if(state.role!=='admin'){toast('Only Manager/Admin can register assets.','warn');return;}
    modal('Register asset','Add a company asset to the inventory.',`<div class="grid sm:grid-cols-2 gap-4">${field('Asset name','asName','')}${selectField('Asset type','asCategory',['Laptop','Monitor','Specialized device','Camera','Tablet','Peripheral'],'Laptop')}${field('Serial / identifier','asSerial','')}${selectField('Initial status','asStatus',['Available','Maintenance','Damaged','Lost','Retired'],'Available')}</div>`,`<button onclick="closeModal()" class="px-4 py-2.5 rounded-full border border-gray-200 text-xs font-bold">Cancel</button><button onclick="saveAsset()" class="px-5 py-2.5 rounded-full bg-[#1A1D1F] dark-primary text-white text-xs font-bold">Register asset</button>`);
  }
  function saveAsset(){
    const name=document.getElementById('asName').value.trim(),serial=document.getElementById('asSerial').value.trim();
    if(!name||!serial){toast('Asset name and serial are required.','warn');return;}
    if(DB.assets.some(a=>a.serial.toLowerCase()===serial.toLowerCase())){toast('That serial / identifier is already registered.','warn');return;}
    const next='AST-'+String(Math.max(...DB.assets.map(a=>+a.id.split('-')[1]))+1).padStart(3,'0');
    DB.assets.push({id:next,name,category:document.getElementById('asCategory').value,serial,status:document.getElementById('asStatus').value});closeModal();render();toast('Asset registered.');
  }
  function openAssetAction(id){
    const a=DB.assets.find(x=>x.id===id);if(!a||state.role!=='admin')return;
    const current=currentAssetAssignment(id); const employees=DB.employees.filter(e=>e.status==='Active');
    const history=DB.assetAssignments.filter(x=>x.asset===id).sort((x,y)=>y.assignedDate.localeCompare(x.assignedDate));
    const canAssign=!current && a.status==='Available';
    const buttons=current?`<button onclick="returnAsset('${id}')" class="w-full py-3 rounded-2xl bg-app-green-bg text-app-green text-xs font-bold">Return asset</button>`:canAssign?`<button onclick="assignAsset('${id}')" class="w-full py-3 rounded-2xl bg-[#1A1D1F] dark-primary text-white text-xs font-bold">Assign asset</button>`:'';
    modal(a.name,`${a.id} · ${a.serial}`,`<div class="space-y-4"><div class="grid grid-cols-2 gap-3"><div class="subtle bg-app-subtle rounded-2xl p-4"><div class="text-[10px] font-bold text-app-muted muted">STATUS</div><div class="mt-2">${statusPill(a.status)}</div></div><div class="subtle bg-app-subtle rounded-2xl p-4"><div class="text-[10px] font-bold text-app-muted muted">CURRENT ASSIGNMENT</div><div class="text-xs font-bold mt-2 txt">${current?emp(current.employee)?.name:'—'}</div></div></div>${canAssign?selectField('Assign to','assetPerson',employees.map(e=>`${e.id} · ${e.name}`),`${employees[0].id} · ${employees[0].name}`):''}${selectField('Update status','assetStatus',['Available','Assigned','Maintenance','Damaged','Lost','Retired'],a.status)}<button onclick="updateAssetStatus('${id}')" class="w-full py-3 rounded-2xl border border-gray-200 text-xs font-bold">Save status</button>${buttons}<div class="border-t border-app-border pt-4"><div class="text-[10px] uppercase tracking-wider font-extrabold text-app-muted muted mb-2">Assignment history</div>${history.length?history.map(h=>`<div class="text-xs py-2 flex justify-between gap-3"><span class="font-semibold txt">${emp(h.employee)?.name}</span><span class="text-app-muted muted">${fmtDate(h.assignedDate)}${h.returnedDate?` → ${fmtDate(h.returnedDate)}`:' → Current'}</span></div>`).join(''):'<div class="text-xs text-app-muted muted">No assignment history.</div>'}</div></div>`,'', 'max-w-2xl');
  }
  function assignAsset(id){
    const a=DB.assets.find(x=>x.id===id); if(!a||currentAssetAssignment(id)){toast('This asset already has an active assignment.','warn');return;} if(a.status!=='Available'){toast('Only available assets can be assigned.','warn');return;}
    const eid=document.getElementById('assetPerson').value.split(' · ')[0]; const next=`AA-${String(DB.assetAssignments.length+1).padStart(3,'0')}`;
    DB.assetAssignments.push({id:next,asset:id,employee:eid,assignedDate:DEMO_TODAY,returnedDate:null,status:'Active'});a.status='Assigned';closeModal();render();toast('Asset assigned.');
  }
  function returnAsset(id){
    const a=DB.assets.find(x=>x.id===id), assignment=currentAssetAssignment(id);if(!a||!assignment)return;
    assignment.returnedDate=DEMO_TODAY;assignment.status='Returned';a.status='Available';closeModal();render();toast('Asset returned and assignment history retained.');
  }
  function updateAssetStatus(id){
    const a=DB.assets.find(x=>x.id===id), current=currentAssetAssignment(id), s=document.getElementById('assetStatus').value;
    if(s==='Assigned'&&!current){toast('Use Assign asset to create an assignment record.','warn');return;}
    if(s!=='Assigned'&&current){toast('Return the asset before changing it away from Assigned.','warn');return;}
    a.status=s;closeModal();render();toast('Asset status updated.');
  }

  // ---------------------------------------------------------------------------
  // Search + export
  // ---------------------------------------------------------------------------
  function handleGlobalSearch(q){
    const box=document.getElementById('searchResults');q=q.trim().toLowerCase();if(q.length<2){box.classList.add('hidden');return;}
    const results=[];
    DB.employees.filter(e=>canSeeEmployee(e)&&[e.name,e.id,e.title,e.department,e.team,e.project].join(' ').toLowerCase().includes(q)).slice(0,5).forEach(e=>results.push({type:'Employee',label:e.name,meta:`${e.id} · ${e.title}`,icon:'user',action:`state.currentPage='employees';state.selectedEmployee='${e.id}';closePopovers();render()`}));
    allowedLeave().filter(x=>[x.id,x.type,x.status,emp(x.employee)?.name].join(' ').toLowerCase().includes(q)).slice(0,3).forEach(x=>results.push({type:'Leave',label:`${emp(x.employee)?.name} · ${x.type}`,meta:`${x.id} · ${x.status}`,icon:'calendar-days',action:`state.currentPage='leave';closePopovers();render()`}));
    allowedAssets().filter(a=>[a.id,a.name,a.serial,a.status].join(' ').toLowerCase().includes(q)).slice(0,3).forEach(a=>results.push({type:'Asset',label:a.name,meta:`${a.id} · ${a.status}`,icon:'laptop',action:`state.currentPage='assets';closePopovers();render()`}));
    box.innerHTML=results.length?results.map(r=>`<button onclick="${r.action}" class="w-full p-3 rounded-2xl hover:bg-app-subtle hover-surface flex items-center gap-3 text-left"><div class="w-9 h-9 rounded-xl bg-app-subtle subtle flex items-center justify-center"><i data-lucide="${r.icon}" class="w-4 h-4"></i></div><div class="min-w-0"><div class="text-[10px] font-bold text-app-muted muted">${r.type}</div><div class="text-xs font-extrabold txt clip-text">${r.label}</div><div class="text-[10px] text-app-muted muted clip-text">${r.meta}</div></div></button>`).join(''):`<div class="p-6 text-center text-xs font-semibold text-app-muted muted">No matches found.</div>`;
    box.classList.remove('hidden'); box.style.animation='none'; box.offsetHeight; box.style.animation=''; lucide.createIcons();
  }

  function exportCSV(type){
    const employees=allowedEmployees(), leaves=allowedLeave(), attendance=allowedAttendance(), assets=allowedAssets();
    const data={
      employees:{name:'employee-list.csv',headers:['Employee ID','Name','Job title','Department','Team','Project','Status'],rows:employees.map(e=>[e.id,e.name,e.title,e.department,e.team,e.project,e.status])},
      leave:{name:'leave-summary.csv',headers:['Request ID','Employee','Type','From','To','Days','Status'],rows:leaves.map(x=>[x.id,emp(x.employee)?.name,x.type,x.from,x.to,x.days,x.status])},
      attendance:{name:'attendance-summary.csv',headers:['Employee','Date','Status','Check in','Check out','Hours','Note'],rows:attendance.map(x=>[emp(x.employee)?.name,x.date,x.status,x.checkIn,x.checkOut,x.hours,x.note])},
      assets:{name:'asset-status.csv',headers:['Asset ID','Name','Type','Serial','Status','Assigned to','Assigned date'],rows:assets.map(a=>{const asn=currentAssetAssignment(a.id);return [a.id,a.name,a.category,a.serial,a.status,asn?emp(asn.employee)?.name:'',asn?.assignedDate||'']})}
    }[type];
    const csv=[data.headers,...data.rows].map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n');
    const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=data.name;a.click();URL.revokeObjectURL(url);toast(`${data.name} exported.`);
  }

  document.addEventListener('click',e=>{
    if(!e.target.closest('#profileMenu')&&!e.target.closest('button[onclick="toggleProfileMenu()"]')) document.getElementById('profileMenu')?.classList.add('hidden');
    if(!e.target.closest('#notificationMenu')&&!e.target.closest('button[onclick="toggleNotifications()"]')) document.getElementById('notificationMenu')?.classList.add('hidden');
    if(!e.target.closest('#searchResults')&&!e.target.closest('#globalSearch')) document.getElementById('searchResults')?.classList.add('hidden');
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      const root=document.getElementById('modalRoot');
      if(root?.querySelector('.login-layer')) return;
      if(root?.firstElementChild) closeModal(); else closePopovers();
    }
  });

  let savedTheme='light';
  try{ savedTheme=localStorage.getItem('evoq-theme')||'light'; }catch(e){}
  applyTheme(savedTheme!=='dark',false);
  render();
  showLogin();
</script>
